# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Ensure app is scaled and ready
        run: |
          echo "Ensuring app is scaled and ready..."
          flyctl scale count 1
          for i in {1..30}; do
            if flyctl status | grep -q "1 desired, 1 placed, 1 healthy, 0 unhealthy"; then
              echo "App is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "App failed to become ready after 5 minutes"
              exit 1
            fi
            echo "Attempt $i: App not ready yet. Waiting 10 seconds..."
            sleep 10
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Run migrations
        run: flyctl ssh console -C "/app/bin/migrate"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}