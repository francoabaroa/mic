# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to be ready..."
          for i in {1..30}; do
            status=$(flyctl status)
            echo "$status"
            if echo "$status" | grep -q "1 desired, 1 placed, 1 healthy, 0 unhealthy"; then
              echo "App is ready!"
              exit 0
            fi
            echo "Attempt $i: App not ready yet. Waiting 10 seconds..."
            sleep 10
          done
          echo "App failed to become ready after 5 minutes"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Scale app and run migrations
        run: |
          echo "Scaling app and running migrations..."
          flyctl scale count 1 --yes
          echo "Waiting for app to be ready..."
          for i in {1..30}; do
            status=$(flyctl status)
            echo "$status"
            if echo "$status" | grep -q "1 desired, 1 placed, 1 healthy, 0 unhealthy"; then
              echo "App is ready!"
              break
            fi
            echo "Attempt $i: App not ready yet. Waiting 10 seconds..."
            sleep 10
          done
          if ! echo "$status" | grep -q "1 desired, 1 placed, 1 healthy, 0 unhealthy"; then
            echo "App failed to become ready after scaling"
            exit 1
          fi
          echo "Running migrations..."
          flyctl ssh console -C "/app/bin/migrate"
          echo "Migrations completed."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}